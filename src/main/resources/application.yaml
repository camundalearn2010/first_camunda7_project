spring.application.name: simpleApplication
server:
  port: 8010
org.camunda.bpm.spring.boot.starter.example.simple.SimpleApplication.exitWhenFinished: false
spring:
  datasource:
    url: jdbc:h2:mem:example-simple;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
camunda:
  bpm:    
    application:
      delete-upon-undeploy: false
      scan-for-process-definitions: false
      deploy-changed-only: true
      resume-previous-versions: true
      resume-previous-by: a value
    admin-user:
      id: demo
      password: demo
    job-execution:
      enabled: true
    metrics:
      enabled: false
      db-reporter-activate: false


#camunda.bpm.auto-deployment-enabled: false

